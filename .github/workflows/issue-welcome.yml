name: Issue — Welcome & Label

on:
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Apply user-replied label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['user-replied']
            });

      - name: Post welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const repoName = context.repo.repo;

            const body = [
              `Hey @${author}, the field station has received your report. 🌱`,
              ``,
              `@TheCodingDad-TisonK has been notified and will review your findings as soon as possible.`,
              ``,
              `**Before the agronomist arrives, please confirm:**`,
              ``,
              `- [ ] You are running the latest version of Seasonal Crop Stress (visible in the mod manager)`,
              `- [ ] Your issue includes the relevant \`[CropStress]\` lines from \`log.txt\``,
              `  - Log location: \`Documents/My Games/FarmingSimulator2025/log.txt\``,
              `  - Search for \`[CropStress]\` and paste the relevant section here`,
              `- [ ] If this involves a specific crop or season, note which one and what the current in-game season/day is`,
              `- [ ] You have searched [existing issues](https://github.com/${context.repo.owner}/${repoName}/issues) for a similar report`,
              ``,
              `> **Note:** Issues without a log snippet are difficult to diagnose and may be closed. Seasonal timing and stress values are often key to reproducing bugs.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
